results_dir: /workspace/results/export

model:
  backbone:
    type: fan_small_12_p4_hybrid
    pretrained_backbone_path: /workspace/train/pretrained_fan_classification_imagenet_vfan_hybrid_small/fan_hybrid_small.pth
    freeze_backbone: True
  head:
    type: TAOLinearClsHead
    binary: false
    in_channels: 512
    topk: [1]

dataset:
  num_classes: 3
  img_size: 224
  classes_file: /workspace/data/classes.txt

export:
  checkpoint: /workspace/train/results/train/classifier_model_latest.pth
  onnx_file: /workspace/models/classifier_model.onnx
  on_cpu: false
  input_channel: 3
  input_width: 224
  input_height: 224
  batch_size: -1
